[workspace]
members = [
    "apps/skyengine",
    "apps/skydbg",
    "crates/skyengine-core",
    "crates/skyengine-ffi",
    "crates/skyengine-sdl",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
encoding_rs = "0.8.35"
flate2 = "1.1.2"
jpeg-decoder = { version = "0.3.2", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sdl2 = "0.38.0"
thiserror = "2.0.12"

[profile.release]
lto = "thin"
strip = "debuginfo"
