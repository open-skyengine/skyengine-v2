[workspace]
members = [
    "apps/skyengine",
    "apps/skydbg",
    "crates/skyengine-core",
    "crates/skyengine-ffi",
    "crates/skyengine-sdl",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
encoding_rs = "0.8.35"
flate2 = "1.1.2"
jpeg-decoder = { version = "0.3.2", default-features = false }
midly = { version = "0.5.3", default-features = false, features = ["std"] }
rustysynth = "1.3.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sdl2 = "0.38.0"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }
thiserror = "2.0.12"

[profile.release]
# ThinLTO can leave Rust symbols unresolved in MSVC static and dynamic libraries.
lto = "fat"
strip = "debuginfo"
